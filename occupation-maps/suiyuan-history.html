<style>

<script>
// ---------------------------------------------------------------------------

// Sources: Wikipedia coordinate data and OpenStreetMap / Nominatim.
// ---------------------------------------------------------------------------
const PLACES = {
  dolonnor:    { name: "Dolonnor (多倫)",              lat: 42.19974, lon: 116.47922 },
  guyuan:      { name: "Guyuan (沽源)",                lat: 41.66774, lon: 115.68814 },
  dushikou:    { name: "Dushikou (獨石口)",            lat: 41.31992, lon: 115.70325 },
  datan:       { name: "Datan, Fengning (大灘)",       lat: 41.57914, lon: 116.01300 },
  zhangbei:    { name: "Zhangbei (張北)",              lat: 41.15685, lon: 114.71066 },
  huade:       { name: "Huade / Dehua (化德・徳化)",    lat: 41.90043, lon: 114.00272 },
  shangdu:     { name: "Shangdu (商都)",               lat: 41.55575, lon: 113.56795 },
  honggeertu:  { name: "Honggeertu (紅格爾圖)",        lat: 41.68508, lon: 113.21356 },
  bailingmiao: { name: "Bailingmiao (百霊廟)",         lat: 41.70306, lon: 110.43500 },
  xilamulen:   { name: "Xilamulen Temple (錫拉木倫廟)", lat: 42.04196, lon: 111.52634 },
  pingdiquan:  { name: "Pingdiquan (平地泉)",          lat: 40.93883, lon: 113.12633 },
  nankou:      { name: "Nankou (南口)",                lat: 40.22898, lon: 116.14116 },
  juyongguan:  { name: "Juyongguan (居庸關)",          lat: 40.28820, lon: 116.06860 },
  wanquan:     { name: "Wanquan (萬全)",               lat: 40.75797, lon: 114.73366 },
  zhangjiakou: { name: "Zhangjiakou / Kalgan (張家口)", lat: 40.76750, lon: 114.88580 },
  huailai:     { name: "Huailai (懷來)",               lat: 40.39748, lon: 115.51129 },
  xuanhua:     { name: "Xuanhua (宣化)",               lat: 40.60145, lon: 115.05520 },
  datong:      { name: "Datong (大同)",                lat: 40.07630, lon: 113.29990 },
  fengzhen:    { name: "Fengzhen (豐鎮)",              lat: 40.43700, lon: 113.11000 },
  jining:      { name: "Jining (集寧)",                lat: 41.03064, lon: 113.09886 },
  guisui:      { name: "Guisui / Kōwa, now Hohhot (歸綏・厚和)", lat: 40.84210, lon: 111.75030 },
  salaqi:      { name: "Salaqi (薩拉齊)",              lat: 40.54642, lon: 110.49942 },
  baotou:      { name: "Baotou (包頭)",                lat: 40.65800, lon: 109.84020 },
  yuxian:      { name: "Yu county (蔚縣)",             lat: 39.83333, lon: 114.56667 },
  wutai:       { name: "Wutai (五台)",                 lat: 38.80269, lon: 113.41129 },
  fuping:      { name: "Fuping (阜平)",                lat: 38.84900, lon: 114.19510 },
  daqingshan:  { name: "The Daqingshan (大青山)",      lat: 41.00158, lon: 111.43633 },
  wugongba:    { name: "Wugongba pass (蜈蚣壩)",       lat: 40.99000, lon: 111.71000, approx: true },
  shanba:      { name: "Shanba (陝壩)",                lat: 40.88817, lon: 107.14186 },
  wuyuan:      { name: "Wuyuan (五原)",                lat: 41.03463, lon: 108.09195 },
  linhe:       { name: "Linhe (臨河)",                 lat: 40.75100, lon: 107.36400 },
  beisemiao:   { name: "Beise Temple, now Xilinhot (貝子廟)", lat: 43.93340, lon: 116.08600 },
  zasak:       { name: "Zasak Banner, now Ejin Horo (札薩克旗)", lat: 39.56470, lon: 109.74770 },
  uxin:        { name: "Ushin Banner (烏審旗)",        lat: 38.61548, lon: 108.92604 },
  langwogou:   { name: "Langwogou (狼窩溝)",           lat: 41.04927, lon: 114.42050, approx: true }
};

// ---------------------------------------------------------------------------
// Events, in order. `cat` drives the colour; see the legend.
// ---------------------------------------------------------------------------
const EVENTS = [
  { year: 1933, when: "22 Sep 1933", place: "dolonnor", cat: "japan",
    title: "Chahar East Special Autonomous District",
    text: "The Kwantung Army sets up a puppet administration at Dolonnor under the Mongol officer Li Shouxin, modelled on Manchukuo, with about 4,600 troops. From July 1935 it is funded through the Manchukuo Army's Political Department. This is the seed of everything that follows." },

  { year: 1935, when: "15 Jan 1935", place: "guyuan", cat: "japan",
    title: "First Chahar East Incident",
    text: "Japanese-officered Rehe forces attack Chinese positions at Changliang and Wunihe in Guyuan county. Wang Ziliang's troops repel them and take over 40 prisoners." },
  { year: 1935, when: "23–25 Jan 1935", place: "dushikou", cat: "japan",
    title: "Dushikou and Guyuan bombed",
    text: "Japanese aircraft bomb both towns; roughly 3,000 Japanese and 2,000 puppet troops attack on the ground." },
  { year: 1935, when: "2 Feb 1935", place: "datan", cat: "japan",
    title: "Datan oral accord (大灘口約)",
    text: "Agreed at the Japanese headquarters at Datan in Fengning. Chinese forces are to stay west of the Great Wall line at Shichengzi and Dongzhazi. About 700 km² east of the Guyuan–Dushikou line becomes a de facto demilitarised zone." },
  { year: 1935, when: "5 Jun 1935", place: "zhangbei", cat: "japan",
    title: "Second Zhangbei Incident",
    text: "Four Japanese officers travelling without passports and sketching maps are detained near Zhangbei by the 29th Army, and released after eight hours on Song Zheyuan's order. Japan uses the detention as a pretext." },
  { year: 1935, when: "27 Jun 1935", place: "zhangbei", cat: "japan",
    title: "Ching–Doihara agreement (秦土協定)",
    text: "Song Zheyuan's 29th Army withdraws from Zhangbei county and everything north of it; two security forces of 4,000 men take over. In effect the whole of Chahar north of the Great Wall is demilitarised. Chinese accounts put the loss at 70–80% of the province. No Japanese army of occupation is involved — Chahar is conceded by agreement, not by battle." },

  { year: 1936, when: "12 May 1936", place: "huade", cat: "japan",
    title: "Mongol Military Government proclaimed",
    text: "Demchugdongrub (德王) and Prince Yun establish the Mongol Military Government at Dehua. Kwantung Army advisers hold the real authority. The Chahar East district is absorbed into it." },
  { year: 1936, when: "14–18 Nov 1936", place: "honggeertu", cat: "china",
    title: "Battle of Honggeertu",
    text: "Wang Ying's \"Great Han Righteous Army\" and Mongol units — 1,500 to 5,000 men with Japanese aircraft, artillery and armoured cars — attack. The assault fails and the attackers fall back on Shangdu on the 19th." },
  { year: 1936, when: "Nov 1936", place: "pingdiquan", cat: "china",
    title: "Fu Zuoyi's forward command post",
    text: "Fu Zuoyi directs the defence of Honggeertu in person from Pingdiquan." },
  { year: 1936, when: "23–24 Nov 1936", place: "bailingmiao", cat: "china",
    title: "Bailingmiao retaken",
    text: "Fu Zuoyi's Jin–Sui troops storm the lamasery at night and take it by 09:30 on the 24th. The Japanese adviser and the puppet 7th Division commander escape by car. A puppet counter-attack on 2–4 December is destroyed and its commander Lei Zhongtian killed." },
  { year: 1936, when: "8–9 Dec 1936", place: "xilamulen", cat: "china",
    title: "Defections at Xilamulen Temple",
    text: "The puppet brigade commanders Shi Yushan and Jin Xianzhang defect with some 6,000 men, wipe out the Mukedengbao division and kill around 20 to 29 Japanese officers. The campaign ends on the 19th. Japan holds nothing in Suiyuan — and, having used Mongol and puppet infantry rather than its own divisions, loses nothing it cannot disown." },

  { year: 1937, when: "8–26 Aug 1937", place: "nankou", cat: "japan",
    title: "Nankou campaign",
    text: "About 60,000 Chinese hold the pass against roughly 70,000 Japanese for eighteen days. Chinese losses are given as 9,703 dead and 23,989 wounded. The Chahar Operation had been approved on 8 August and began on the 9th, under a three-brigade expeditionary force commanded by Tōjō Hideki." },
  { year: 1937, when: "14–16 Aug 1937", place: "huade", cat: "china",
    title: "Shangdu and Huade briefly retaken",
    text: "Chinese forces recover Shangdu on the 14th and Huade on the 16th, before the weight of the Japanese advance tells." },
  { year: 1937, when: "21 Aug 1937", place: "juyongguan", cat: "japan",
    title: "Juyongguan attacked",
    text: "Japanese forces attack the pass; Chinese troops pull back from the Zhangbei sector." },
  { year: 1937, when: "24 Aug 1937", place: "wanquan", cat: "japan",
    title: "Wanquan falls",
    text: "Shenweitai had fallen the day before. The road to Zhangjiakou is open." },
  { year: 1937, when: "27 Aug 1937", place: "zhangjiakou", cat: "japan",
    title: "Zhangjiakou falls",
    text: "The provincial capital of Chahar is taken and Chinese forces are ordered to break contact. Huailai is occupied the same night; Xuanhua falls on the 28th." },
  { year: 1937, when: "4 Sep 1937", place: "zhangjiakou", cat: "japan",
    title: "South Chahar Autonomous Government",
    text: "The first of the three puppet governments is set up at Zhangjiakou." },
  { year: 1937, when: "13 Sep 1937", place: "datong", cat: "japan",
    title: "Datong falls",
    text: "The advance turns west along the Pingsui railway. Fengzhen and Jining are taken during September; Chinese sources give no exact day." },
  { year: 1937, when: "Sep 1937", place: "jining", cat: "japan",
    title: "Jining and Fengzhen taken",
    text: "The railway junction at Jining and the town of Fengzhen pass into Japanese hands during September." },
  { year: 1937, when: "14 Oct 1937", place: "guisui", cat: "japan",
    title: "Guisui falls",
    text: "The capital of Suiyuan is taken. The Mengjiang regime renames it Kōwa/Houhe (厚和豪特); it is today's Hohhot." },
  { year: 1937, when: "15 Oct 1937", place: "datong", cat: "japan",
    title: "North Shanxi Autonomous Government",
    text: "The second puppet government is set up at Datong." },
  { year: 1937, when: "16 Oct 1937", place: "salaqi", cat: "japan",
    title: "Salaqi taken",
    text: "The last town on the railway before Baotou." },
  { year: 1937, when: "17 Oct 1937", place: "baotou", cat: "japan",
    title: "Baotou falls — the Chahar Operation ends",
    text: "The railway was built to Baotou and stops there. Japanese control in Suiyuan will not extend further west than this at any point in the next eight years, apart from six weeks in 1940. Japanese accounts admit the advance outran its supply and follow-on units went hungry." },
  { year: 1937, when: "26 Oct 1937", place: "yuxian", cat: "ccp",
    title: "Yang Chengwu takes Yu county",
    text: "The first Communist foothold in Chahar, inside the nominal territory of the South Chahar puppet government." },
  { year: 1937, when: "27 Oct / 7 Nov 1937", place: "wutai", cat: "ccp",
    title: "Jin–Cha–Ji Military Region formed",
    text: "Nie Rongzhen forms the headquarters at Wutai with about 3,000 men; the military region is formally established on 7 November." },
  { year: 1937, when: "28 Oct 1937", place: "guisui", cat: "japan",
    title: "Mongol League Autonomous Government",
    text: "The third puppet government is proclaimed at Guisui, now renamed Kōwa." },
  { year: 1937, when: "22 Nov 1937", place: "zhangjiakou", cat: "japan",
    title: "Mengjiang Joint Committee",
    text: "The three autonomous governments are given a coordinating body at Zhangjiakou, and the Mengjiang Bank is set up the same day. The term \"Mengjiang\" as a regional unit dates from here." },

  { year: 1938, when: "4 Jan 1938", place: "zhangjiakou", cat: "japan",
    title: "Mongolia Garrison Detachment formed",
    text: "Formed by Continental Order No. 42 directly under Imperial General Headquarters, responsible for security in Inner Mongolia, southern Chahar and northern Shanxi. Reorganised as the Mongolia Garrison Army on 4 July 1938 under the North China Area Army." },
  { year: 1938, when: "10 Jan 1938", place: "fuping", cat: "ccp",
    title: "Jin–Cha–Ji border region government",
    text: "The border region's administrative committee is elected at Fuping — the first Communist-led base-area government behind Japanese lines." },
  { year: 1938, when: "29 Jul 1938", place: "daqingshan", cat: "ccp",
    title: "The march into the Daqingshan",
    text: "The 120th Division's Daqingshan Detachment under Li Jingquan, the 4th Guerrilla Detachment and a mobilisation-committee cadre group — about 2,300 men — set out for the mountains north of the Guisui–Baotou railway." },
  { year: 1938, when: "Sep 1938", place: "wugongba", cat: "ccp",
    title: "Wugongba ambush",
    text: "Eighty-odd Japanese killed in twenty-five minutes on the Hohhot–Wuchuan road. The pass is about 17 km north of Guisui at the old Baidaoling; this point is approximate." },
  { year: 1938, when: "Nov–Dec 1938", place: "daqingshan", cat: "ccp",
    title: "Three guerrilla zones established",
    text: "The detachment converts from infantry to cavalry to survive in the steppe, and by December holds three guerrilla zones — Suizhong, Suixi and Suinan — astride the railway the Japanese position in Suiyuan depends on." },

  { year: 1939, when: "1 Sep 1939", place: "zhangjiakou", cat: "japan",
    title: "Mengjiang United Autonomous Government",
    text: "The three governments merge, capital Zhangjiakou, Demchugdongrub chairman. Five leagues, two administrative offices and two special cities. Japanese supreme advisers hold the actual decision-making power and much of the paperwork is produced in Japanese." },
  { year: 1939, when: "1939", place: "shanba", cat: "china",
    title: "Suiyuan's wartime capital",
    text: "The Nationalist provincial government relocates to Shanba in the Hetao. Fu Zuoyi is both provincial chairman and deputy commander of the Eighth War Zone. He will run a civil administration, irrigation works and land reclamation here for the rest of the war." },
  { year: 1939, when: "17–24 Dec 1939", place: "baotou", cat: "china",
    title: "Raid on Baotou",
    text: "Fu Zuoyi's 35th Army attacks Baotou, where the Japanese cavalry command is based. He is driven off, but demonstrates that the westernmost Japanese garrison is exposed." },

  { year: 1940, when: "28 Jan 1940", place: "baotou", cat: "japan",
    title: "The Hetao offensive begins",
    text: "The Mongolia Garrison Army under Okabe Naozaburō drives west in three columns — the 26th Division, the Cavalry Group and the 2nd Independent Mixed Brigade, some 30,000 men, plus three divisions each of Mongol and West Suiyuan puppet troops." },
  { year: 1940, when: "3 Feb 1940", place: "wuyuan", cat: "japan",
    title: "Wuyuan occupied",
    text: "Chinese positions were broken on 1–2 February. This is the only moment in the whole war when Japanese control in Suiyuan extends past Baotou." },
  { year: 1940, when: "3 Feb 1940", place: "linhe", cat: "japan",
    title: "Linhe taken",
    text: "The western Hetao falls with it. Around 1 March the Japanese main force withdraws east to its start line, leaving a puppet garrison and a special-service agency behind — Okabe judged permanent occupation impossible with the troops available, over his chief of staff's objection." },
  { year: 1940, when: "20–28 Mar 1940", place: "wuyuan", cat: "china",
    title: "Wuyuan retaken",
    text: "Assault parties from the 35th Army's 31st, 32nd and 101st Divisions infiltrate the new and old towns at midnight on the 20th and destroy the special-service agency of about 34 men. Operations end on the 28th. The line established here does not move again until the Japanese surrender." },
  { year: 1940, when: "Jun 1940", place: "beisemiao", cat: "japan",
    title: "Shilingol League office moves",
    text: "From Sunid Left Banner to Beise Temple — a useful marker for dating the Mengjiang regime's own administrative maps." },

  { year: 1941, when: "31 Aug 1941", place: "zhangjiakou", cat: "japan",
    title: "Renamed the Mongol Autonomous State",
    text: "Mengjiang is renamed 蒙古自治邦 for internal purposes at Demchugdongrub's urging and with Japanese army backing; the old name is kept for external use." },
  { year: 1941, when: "May–Oct 1941", place: "daqingshan", cat: "japan",
    title: "Sweeps against the base area",
    text: "Japanese and puppet forces attack the Eighth Route Army's party and government organs in western Suiyuan five or six times and mount more than ten sweeps across western Inner Mongolia. There is no further Japanese offensive of any size in Suiyuan after March 1940; the fighting moves entirely inside the occupied zone." },

  { year: 1942, when: "Jan–Feb 1942", place: "daqingshan", cat: "japan",
    title: "Sweeps of the Suinan zone",
    text: "First 1,000 and then 2,000 troops sweep the southern guerrilla zone, part of a wider 1942 campaign built around a \"general war\" doctrine and the \"administrative leapfrog\" movement." },
  { year: 1942, when: "24 Oct 1942", place: "daqingshan", cat: "ccp",
    title: "Saibei Military Sub-district formed",
    text: "The Daqingshan Cavalry Detachment merges with forces from northern Shanxi under Yao Zhe." },

  { year: 1943, when: "1 Jan 1943", place: "xuanhua", cat: "japan",
    title: "Xuanhua and Datong provinces",
    text: "The South Chahar administrative office becomes Xuanhua province and the North Shanxi office becomes Datong province — the last significant change to Mengjiang's internal structure. The iron ore at Longyan near Xuanhua is worked under Japanese military direction, with reserves put at 91.645 million tonnes by 1941." },
  { year: 1943, when: "26 Mar 1943", place: "zasak", cat: "other",
    title: "Ikh Juu League Incident",
    text: "Some 400 Zasak Banner security troops attack the Nationalist party headquarters and the Sui–Mongol political council. This is a revolt of Mongol banner troops against Nationalist rule, not a Japanese advance. Japan tried to exploit it and did not gain control of the Ordos." },
  { year: 1943, when: "15 Apr 1943", place: "uxin", cat: "other",
    title: "Ushin Banner rises",
    text: "Over 2,000 banner troops and civilians join the revolt. It is put down by Chen Changjie and He Wending with the Ikh Juu defence cavalry. Mao Zedong later cited the suppression in On Coalition Government as an error of Han chauvinism." },
  { year: 1943, when: "1943", place: "daqingshan", cat: "ccp",
    title: "The worst year in the mountains",
    text: "Fighters frequently without food and widespread malnutrition. Yao Zhe's response is a policy of concealed struggle: preserve the force, do not seek battle. The base survives by dispersal." },

  { year: 1945, when: "Jul 1945", place: "daqingshan", cat: "ccp",
    title: "Suiyuan–Mongolia Military Region",
    text: "The Saibei sub-district is upgraded, with Yao Zhe commanding. It will expand rapidly over the next two months." },
  { year: 1945, when: "11 Aug 1945", place: "dolonnor", cat: "soviet",
    title: "Soviet–Mongolian forces cross the border",
    text: "Cavalry-mechanised forces drive from Outer Mongolia on Dolonnor and Zhangjiakou, cutting the link between the Kwantung Army and the China Expeditionary Army. The USSR had declared war on 8 August, the Mongolian People's Republic on the 10th." },
  { year: 1945, when: "14–16 Aug 1945", place: "shangdu", cat: "soviet",
    title: "Huade and Shangdu taken",
    text: "The northern Chahar towns fall in succession as the advance rolls south." },
  { year: 1945, when: "16 Aug 1945", place: "zhangbei", cat: "soviet",
    title: "Zhangbei entered",
    text: "Soviet–Mongolian troops reach the town whose evacuation by Chinese regulars had been the price of the 1935 agreements." },
  { year: 1945, when: "19 Aug 1945", place: "zhangjiakou", cat: "japan",
    title: "Mengjiang collapses",
    text: "The government dissolves. Demchugdongrub and Li Shouxin flee to Peiping with the withdrawing Garrison Army headquarters." },
  { year: 1945, when: "20–21 Aug 1945", place: "langwogou", cat: "soviet",
    title: "Langwogou positions taken",
    text: "The last Japanese line covering Zhangjiakou from the north is broken. This point is approximate." },
  { year: 1945, when: "21 Aug 1945", place: "zhangjiakou", cat: "japan",
    title: "The Garrison Army's delaying action",
    text: "Nemoto Hiroshi's army fights until this date to complete the evacuation of about 40,000 Japanese civilians. It had been ordered to surrender to Soviet forces and judged the order unrealistic. It completes its withdrawal south of the Great Wall by 27 August." },
  { year: 1945, when: "22 Aug 1945", place: "jining", cat: "ccp",
    title: "Jining and Fengzhen taken",
    text: "Eighth Route Army Jin–Cha–Ji units take the strategic points on the railway. Chiang Kai-shek had named Fu Zuoyi the surrender-receiving officer for Rehe, Chahar and Suiyuan on the 18th — a paper claim to territory Communist troops were already entering." },
  { year: 1945, when: "23 Aug 1945", place: "zhangjiakou", cat: "ccp",
    title: "Zhangjiakou occupied",
    text: "Pingbei sub-district troops under Zhan Danan and Duan Suquan take the city on the morning of the 23rd, on Guo Tianmin's order of the 15th." },
  { year: 1945, when: "23 Aug 1945", place: "bailingmiao", cat: "ccp",
    title: "Link-up at Bailingmiao",
    text: "Eighth Route Army and Suiyuan–Mongolia units meet Soviet–Mongolian forces at Shangdu, Dolonnor and Bailingmiao." },
  { year: 1945, when: "18 Oct – 14 Dec 1945", place: "guisui", cat: "china",
    title: "The Pingsui railway campaign",
    text: "Nie Rongzhen and He Long with about 53,000 men against Fu Zuoyi with about 60,000. The Communists take six eastern Suiyuan counties but fail to take Guisui or Baotou and withdraw. The occupation ends; the civil war for the same railway begins immediately." }
];

const COLOURS = {
  japan:  getComputedStyle(document.documentElement).getPropertyValue("--japan").trim(),
  china:  getComputedStyle(document.documentElement).getPropertyValue("--china").trim(),
  ccp:    getComputedStyle(document.documentElement).getPropertyValue("--ccp").trim(),
  soviet: getComputedStyle(document.documentElement).getPropertyValue("--soviet").trim(),
  other:  getComputedStyle(document.documentElement).getPropertyValue("--other").trim()
};

// ---------------------------------------------------------------------------
// Map
// ---------------------------------------------------------------------------
const map = L.map("map", { zoomControl: true }).setView([40.9, 112.4], 6);

L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: "abcd",
  maxZoom: 18
}).addTo(map);

// Several events share a location — Zhangjiakou carries eight. Fan repeats out
// on a small spiral so every marker stays clickable.
const seen = {};
function offsetFor(key) {
  const n = seen[key] = (seen[key] || 0) + 1;
  if (n === 1) return [0, 0];
  const angle = (n - 1) * 1.1;
  const r = 0.035 + (n - 1) * 0.012;
  return [r * Math.sin(angle), r * Math.cos(angle) * 1.3];
}

EVENTS.forEach((ev, i) => {
  const p = PLACES[ev.place];
  const [dlat, dlon] = offsetFor(ev.place);
  ev.index = i;
  ev.latlng = [p.lat + dlat, p.lon + dlon];
  ev.placeName = p.name;
  ev.approx = !!p.approx;
  ev.colour = COLOURS[ev.cat];

  ev.marker = L.circleMarker(ev.latlng, {
    radius: 6,
    color: "#fff",
    weight: 1.5,
    fillColor: ev.colour,
    fillOpacity: 0.9
  });

  ev.marker.bindPopup(
    '<h3>' + ev.title + '</h3>' +
    '<span class="when">' + ev.when + '</span>' +
    '<div>' + ev.text + '</div>' +
    '<p class="place">' + p.name + (p.approx ? " — approximate" : "") + '</p>',
    { maxWidth: 320 }
  );

  ev.marker.on("click", () => select(i));
});

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const YEARS = [...new Set(EVENTS.map(e => e.year))].sort();
let yearFilter = null;   // null = all years
let cursor = null;       // index into EVENTS, or null for "show all"

const elYears  = document.getElementById("years");
const elList   = document.getElementById("events");
const elPrev   = document.getElementById("prev");
const elNext   = document.getElementById("next");
const elAll    = document.getElementById("showall");
const elCount  = document.getElementById("count");

function visible() {
  return EVENTS.filter(e => yearFilter === null || e.year === yearFilter);
}

function buildYears() {
  const mk = (label, value) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.dataset.year = value === null ? "" : value;
    b.addEventListener("click", () => {
      yearFilter = value;
      cursor = null;
      render();
    });
    elYears.appendChild(b);
  };
  mk("All", null);
  YEARS.forEach(y => mk(String(y), y));
}

function buildList() {
  EVENTS.forEach(ev => {
    const li = document.createElement("li");
    li.style.setProperty("--cat", ev.colour);
    li.innerHTML = '<span class="when">' + ev.when + '</span>' +
                   '<span class="what">' + ev.title + '</span>';
    li.addEventListener("click", () => select(ev.index));
    ev.li = li;
    elList.appendChild(li);
  });
}

function select(i) {
  const list = visible();
  // Clicking an event outside the current year filter widens the filter to it.
  if (!list.some(e => e.index === i)) {
    yearFilter = null;
  }
  cursor = i;
  render();
}

function step(dir) {
  const list = visible();
  if (!list.length) return;
  if (cursor === null) {
    cursor = dir > 0 ? list[0].index : list[list.length - 1].index;
  } else {
    const at = list.findIndex(e => e.index === cursor);
    const nextAt = Math.min(Math.max(at + dir, 0), list.length - 1);
    cursor = list[nextAt].index;
  }
  render();
}

function render() {
  const list = visible();
  const at = cursor === null ? -1 : list.findIndex(e => e.index === cursor);

  // Year buttons
  [...elYears.children].forEach(b => {
    const v = b.dataset.year === "" ? null : Number(b.dataset.year);
    b.classList.toggle("on", v === yearFilter);
  });

  EVENTS.forEach(ev => {
    const inFilter = list.some(e => e.index === ev.index);
    const posInList = list.findIndex(e => e.index === ev.index);

    let state; // "hidden" | "past" | "current" | "shown"
    if (!inFilter) {
      state = "hidden";
    } else if (cursor === null) {
      state = "shown";
    } else if (posInList < at) {
      state = "past";
    } else if (posInList === at) {
      state = "current";
    } else {
      state = "hidden";
    }

    // Marker
    if (state === "hidden") {
      if (map.hasLayer(ev.marker)) map.removeLayer(ev.marker);
    } else {
      if (!map.hasLayer(ev.marker)) ev.marker.addTo(map);
      if (state === "past") {
        ev.marker.setStyle({ fillOpacity: 0.2, opacity: 0.25, radius: 5 });
      } else if (state === "current") {
        ev.marker.setStyle({ fillOpacity: 1, opacity: 1, radius: 9, weight: 2.5 });
      } else {
        ev.marker.setStyle({ fillOpacity: 0.9, opacity: 1, radius: 6, weight: 1.5 });
      }
    }

    // List row
    ev.li.hidden = !inFilter;
    ev.li.classList.toggle("current", state === "current");
    ev.li.classList.toggle("past", state === "past");
  });

  // Stepper
  elPrev.disabled = list.length === 0 || at === 0;
  elNext.disabled = list.length === 0 || (at >= 0 && at === list.length - 1);
  elAll.disabled = cursor === null;
  elCount.textContent = cursor === null
    ? list.length + (list.length === 1 ? " event" : " events")
    : (at + 1) + " of " + list.length;

  // Focus
  if (cursor !== null && at >= 0) {
    const ev = EVENTS[cursor];
    // Nudge in to a readable zoom on the first step, then leave the user's alone.
    map.setView(ev.latlng, Math.max(map.getZoom(), 7), { animate: true });
    ev.marker.openPopup();
    ev.li.scrollIntoView({ block: "nearest" });
  } else {
    map.closePopup();
    const pts = list.map(e => e.latlng);
    if (pts.length > 1) map.fitBounds(L.latLngBounds(pts), { padding: [30, 30] });
    else if (pts.length === 1) map.setView(pts[0], 8);
  }
}

elPrev.addEventListener("click", () => step(-1));
elNext.addEventListener("click", () => step(1));
elAll.addEventListener("click", () => { cursor = null; render(); });

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
  if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
  if (e.key === "Escape") { cursor = null; render(); }
});

window.addEventListener("resize", () => map.invalidateSize());

buildYears();
buildList();
render();

// The map div is flex-sized, so Leaflet may not have its real dimensions on the
// first pass. Re-measure once layout has settled and fit again.
requestAnimationFrame(() => { map.invalidateSize(); render(); });
</script>
</body>
</html>
